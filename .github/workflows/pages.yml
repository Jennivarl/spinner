# Publishes this repository to GitHub Pages exactly as it is.
#
# The Pages source is set to "GitHub Actions", which waits for a workflow
# rather than building a branch on its own, so without this file nothing is
# ever deployed. There is no build step: the whole repository is uploaded
# verbatim, so the live page is byte for byte the files in this repo.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
